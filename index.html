<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohd Athar | Portfolio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; line-height: 1.6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { max-width: 500px; background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; border: 1px solid #334155; }
        h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 10px; }
        h2 { font-size: 1.1rem; color: #94a3b8; font-weight: 400; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        p { color: #cbd5e1; font-size: 1.05rem; margin-bottom: 25px; }
        .btn { display: inline-block; background: #0284c7; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Mohd Athar</h1>
        <h2>Software Developer</h2>
        <p>Welcome to my personal slice of the internet. I am building this entire profile website completely from scratch using GitHub Pages.</p>
        <a href="https://github.com" class="btn" target="_blank">View My GitHub Profile</a>
    </div>

</body>
</html>
